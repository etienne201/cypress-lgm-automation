name: CI/CD Cypress E2E Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 7:00 AM CAT
    - cron: '0 12 * * *' # 1:00 PM CAT
    - cron: '0 17 * * *' # 6:00 PM CAT

jobs:
  cypressTestE2E:
    name: 🧪 Cypress Tests & Reports (HTML + PDF)
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://test.lagrowthmachine.xyz
      CYPRESS_BASE_URL: https://test.lagrowthmachine.xyz
      BASE_URL_API: https://apiv2-test.lagrowthmachine.xyz
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20
      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install Node dependencies
      - name: 📦 Install dependencies
        run: npm install

      # Step 4: Verify Cypress binary
      - name: 🔍 Verify Cypress
        run: npx cypress verify

      # Step 5: Run Cypress E2E Tests
      - name: 🚀 Run Cypress E2E Tests
        id: cypress_run
        run: npm run test:ci
        continue-on-error: true

      # Step 6: Generate PDF Test Report
      - name: 📄 Generate PDF Test Report
        if: always()
        run: npm run report:pdf

      # Step 7: Resolve committer email & metadata
      - name: 👤 Resolve Committer Info
        if: always()
        id: committer
        run: |
          AUTHOR_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          AUTHOR_EMAIL="${{ github.event.head_commit.author.email || github.event.pusher.email || secrets.NOTIFICATION_EMAIL }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"
          
          echo "author_name=${AUTHOR_NAME}" >> $GITHUB_OUTPUT
          echo "author_email=${AUTHOR_EMAIL}" >> $GITHUB_OUTPUT
          echo "run_url=${RUN_URL}" >> $GITHUB_OUTPUT
          echo "artifacts_url=${ARTIFACTS_URL}" >> $GITHUB_OUTPUT

      # Step 8: Publish GitHub Step Summary with direct links
      - name: 📊 Publish Execution Summary with Direct Links
        if: always()
        run: |
          STATUS_ICON="${{ steps.cypress_run.outcome == 'success' && '✅ Succès' || '⚠️ Échec des tests' }}"
          echo "## 📊 Rapport d'Exécution Cypress E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrique | Détail |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Statut Global** | ${STATUS_ICON} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auteur du Push** | \`${{ steps.committer.outputs.author_name }}\` (${{ steps.committer.outputs.author_email }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branche** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | ${{ github.event.head_commit.message || 'Exécution manuelle / cron' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lien Direct du Run** | 🔗 [Voir l'Exécution #${{ github.run_number }}](${{ steps.committer.outputs.run_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Téléchargement Rapports** | 📥 [Télécharger PDF & HTML dans Artifacts](${{ steps.committer.outputs.artifacts_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Rapport PDF joint :** Le document PDF vectoriel généré est téléchargeable directement ci-dessous dans la section **Artifacts**." >> $GITHUB_STEP_SUMMARY

      # Step 9: Upload HTML & PDF reports + artifacts
      - name: 📤 Upload Test Reports (HTML & PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-reports
          path: |
            cypress/reports/html
            cypress/reports/cypress-test-report.pdf
            cypress/screenshots
            cypress/videos
          retention-days: 30
          if-no-files-found: warn

      # Step 10: Send Email Report to Committer
      - name: 📧 Send Test Report via Email
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME || 'poutchokoetienne@gmail.com' }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[CI/CD Cypress] ${{ steps.cypress_run.outcome == 'success' && '✅ SUCCÈS' || '❌ ÉCHEC' }} sur ${{ github.ref_name }} (Run #${{ github.run_number }})"
          to: ${{ steps.committer.outputs.author_email != '' && steps.committer.outputs.author_email || 'poutchokoetienne@gmail.com' }},poutchokoetienne@gmail.com
          from: "Cypress CI/CD <poutchokoetienne@gmail.com>"
          html_body: |
            <h2>📊 Rapport de tests Cypress E2E</h2>
            <p>Bonjour <strong>${{ steps.committer.outputs.author_name }}</strong>,</p>
            <p>Voici le résultat de l'exécution suite au push sur la branche <code>${{ github.ref_name }}</code> :</p>
            <ul>
              <li><strong>Statut :</strong> ${{ steps.cypress_run.outcome == 'success' && '✅ SUCCÈS (100% Passed)' || '❌ ÉCHEC' }}</li>
              <li><strong>Commit :</strong> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></li>
              <li><strong>Message :</strong> ${{ github.event.head_commit.message }}</li>
              <li><strong>Lien du Run GitHub Actions :</strong> <a href="${{ steps.committer.outputs.run_url }}">${{ steps.committer.outputs.run_url }}</a></li>
              <li><strong>Téléchargement des artefacts :</strong> <a href="${{ steps.committer.outputs.artifacts_url }}">${{ steps.committer.outputs.artifacts_url }}</a></li>
            </ul>
            <p>📎 <em>Le rapport de test complet au format PDF est attaché à ce courriel.</em></p>
          attachments: cypress/reports/cypress-test-report.pdf
